services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: axolot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: axolot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axolot -d axolot']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://axolot:${POSTGRES_PASSWORD:?set in .env}@db:5432/axolot
      AXOLOT_PORT: ${AXOLOT_PORT:?set in .env}
      AXOLOT_SECRET: ${AXOLOT_SECRET:?set in .env}
      AXOLOT_CORPUS_ROOT: /corpus
      AXOLOT_HARDWARE_FILE: /data/hardware.json
      OLLAMA_URL: ${OLLAMA_URL:?set in .env}
      AXOLOT_BRIDGE_URL: http://host.docker.internal:${AXOLOT_BRIDGE_PORT:?set in .env, make setup adds it}/v1
      AXOLOT_BRIDGE_TOKEN: ${AXOLOT_BRIDGE_TOKEN:?set in .env, make setup adds it}
    ports:
      - '127.0.0.1:${AXOLOT_PORT:?set in .env}:${AXOLOT_PORT:?set in .env}'
    volumes:
      - ./corpus:/corpus
      - ./data:/data:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Go toolchain for tests and lint: docker compose run --rm go go test ./...
  go:
    image: golang:1.26-alpine
    profiles: [tools]
    working_dir: /src
    environment:
      CGO_ENABLED: '0'
      TEST_DATABASE_URL: postgres://axolot:${POSTGRES_PASSWORD:?set in .env}@db:5432/axolot
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  # Vite dev server with hot reload, proxied to the app service.
  web:
    image: node:24-alpine
    profiles: [dev]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      AXOLOT_API: http://app:${AXOLOT_PORT:?set in .env}
    ports:
      - '127.0.0.1:${AXOLOT_WEB_PORT:?set in .env}:5173'
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules

volumes:
  db:
  gomod:
  gocache:
  web_modules:
